<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Paper Scissors vs Computer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <h2>By: Faran Saharan</h2>
  <p>Show your hand to the webcam and play against the computer. First to 3 wins.</p>

  <div class="game">
    <div class="side">
      <h2>Me</h2>
      <div id="webcam"></div>
      <p>Computer Reads: <b id="guess">...</b></p>
    </div>
    <div class="side">
      <h2>Computer</h2>
      <div id="computer">?</div>
    </div>
  </div>

  <p id="countdown"></p>
  <p id="result"></p>
  <p class="score">Me <b id="my-score">0</b> - <b id="comp-score">0</b> Computer</p>

  <button id="start">Start camera</button>
  <button id="play" disabled>Play round</button>

  <div id="game-over" hidden>
    <p>Rematch?</p>
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
